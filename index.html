<!DOCTYPE html>
<html>
<head>
  <title>Clinic Visit Forms</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/survey-core@1.9.92/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-jquery@1.9.92/survey.jquery.min.js"></script>
  <link href="https://unpkg.com/survey-core@1.9.92/defaultV2.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #surveyContainer {
      max-width: 700px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div id="surveyContainer"></div>
  <script>
    const surveyJson = {
      title: "Clinic Visit Forms",
      showQuestionNumbers: "off",
      showProgressBar: "top",
      pages: [
        {
          name: "new_patient",
          title: "New Patient",
          elements: [
            { type: "comment", name: "np_chief_complaint", title: "Chief Complaint" },
            { type: "comment", name: "np_present_illness", title: "History of Present Illness" },
            { type: "comment", name: "np_medical_history", title: "Medical History" },
            { type: "comment", name: "surgical_history", title: "Surgical History" },
            { type: "comment", name: "np_medications_supplements", title: "Medications and Supplements" },
            { type: "comment", name: "np_allergies", title: "Allergies" },
            { type: "comment", name: "np_family_history", title: "Family History" },
            { type: "comment", name: "np_social_history", title: "Social History" },
            { type: "comment", name: "immunizations", title: "Immunizations" },
            { type: "comment", name: "np_review_of_systems", title: "Review of Systems" },
            { type: "checkbox", name: "np_vital_signs", title: "Vital Signs", choices: [
              { value: "bp", text: "Blood Pressure" },
              { value: "pulse", text: "Pulse" },
              { value: "rr", text: "Respiration Rate" },
              { value: "temp", text: "Temperature" }
            ], hasOther: true },
            { type: "checkbox", name: "np_physical_exam", title: "Physical Examination", choices: [
              { value: "ga", text: "General Appearance" },
              { value: "heent", text: "HEENT" },
              { value: "cv", text: "Cardiovascular" },
              { value: "resp", text: "Respiratory" },
              { value: "abd", text: "Abdomen" }
            ], hasOther: true },
            { type: "checkbox", name: "np_lab_imaging", title: "Laboratory, Imaging, and Diagnostic Test Results", choices: [
              { value: "cbc", text: "CBC" },
              { value: "xray", text: "X-Ray" },
              { value: "mri", text: "MRI" },
              { value: "chem", text: "Blood Chemistry" }
            ], hasOther: true },
            { type: "comment", name: "np_assessment_plan", title: "Problem Based Assessment and Plan" }
          ]
        },
        {
          name: "returning_patient",
          title: "Returning Patient",
          elements: [
            { type: "comment", name: "rb_chief_complaint", title: "Chief Complaint" },
            { type: "comment", name: "rb_present_illness", title: "History of Present Illness" },
            { type: "comment", name: "rb_medications_supplements", title: "Medications and Supplements" },
            { type: "checkbox", name: "rb_mental_status_exam", title: "Mental Status Examination", choices: [
              { value: "alert", text: "Alertness" },
              { value: "mood", text: "Mood" },
              { value: "thought", text: "Thought Process" },
              { value: "judgment", text: "Judgment" }
            ], hasOther: true },
            { type: "checkbox", name: "rb_vital_signs", title: "Vital Signs", choices: [
              { value: "hr", text: "Heart Rate" },
              { value: "bp", text: "Blood Pressure" },
              { value: "o2", text: "Oxygen Saturation" }
            ], hasOther: true },
            { type: "checkbox", name: "rb_rating_scales", title: "Rating Scales", choices: [
              { value: "phq9", text: "PHQ-9" },
              { value: "gad7", text: "GAD-7" },
              { value: "mmse", text: "MMSE" }
            ], hasOther: true },
            { type: "comment", name: "rb_assessment_plan", title: "Problem-Based Assessment and Plan" }
          ]
        },
        {
          name: "new_patient_visit",
          title: "New Patient Visit",
          elements: [
            { type: "comment", name: "npv_chief_complaint", title: "Chief Complaint" },
            { type: "comment", name: "npv_present_illness", title: "History of Present Illness" },
            { type: "comment", name: "npv_medical_history", title: "Medical History" },
            { type: "comment", name: "npv_surgical_history", title: "Surgical History" },
            { type: "comment", name: "npv_medications_supplements", title: "Medications and Supplements" },
            { type: "comment", name: "npv_allergies", title: "Allergies" },
            { type: "comment", name: "npv_family_history", title: "Family History" },
            { type: "comment", name: "npv_social_history", title: "Social History" },
            { type: "comment", name: "npv_immunizations", title: "Immunizations" },
            { type: "comment", name: "npv_review_of_systems", title: "Review of Systems" },
            { type: "checkbox", name: "npv_vital_signs", title: "Vital Signs", choices: [
              { value: "temp", text: "Temperature" },
              { value: "rr", text: "Respiratory Rate" },
              { value: "hr", text: "Heart Rate" },
              { value: "bp", text: "Blood Pressure" }
            ], hasOther: true },
            { type: "checkbox", name: "npv_physical_exam", title: "Physical Examination", choices: [
              { value: "skin", text: "Skin" },
              { value: "lymph", text: "Lymph Nodes" },
              { value: "abd", text: "Abdomen" },
              { value: "neuro", text: "Neurological" }
            ], hasOther: true },
            { type: "checkbox", name: "npv_lab_imaging", title: "Laboratory, Imaging, and Diagnostic Test Results", choices: [
              { value: "ua", text: "Urinalysis" },
              { value: "cxr", text: "Chest X-ray" },
              { value: "ct", text: "CT Scan" }
            ], hasOther: true },
            { type: "comment", name: "npv_assessment_plan", title: "Problem Based Assessment and Plan" }
          ]
        }
      ,
        {
          name: "follow_up_visit",
          title: "Follow-Up Visit",
          elements: [
            { type: "comment", name: "fuv_chief_complaint", title: "Chief Complaint" },
            { type: "comment", name: "fuv_present_illness", title: "History of Present Illness" },
            { type: "comment", name: "fuv_medications_supplements", title: "Medications and Supplements" },
            { type: "comment", name: "fuv_review_of_systems", title: "Review of Systems" },
            { type: "checkbox", name: "fuv_vital_signs", title: "Vital Signs", choices: [
              { value: "bp", text: "Blood Pressure" },
              { value: "hr", text: "Heart Rate" },
              { value: "rr", text: "Respiratory Rate" },
              { value: "temp", text: "Temperature" }
            ], hasOther: true },
            { type: "checkbox", name: "fuv_physical_exam", title: "Physical Examination", choices: [
              { value: "heent", text: "HEENT" },
              { value: "cv", text: "Cardiovascular" },
              { value: "resp", text: "Respiratory" },
              { value: "abd", text: "Abdomen" }
            ], hasOther: true },
            { type: "checkbox", name: "fuv_lab_imaging", title: "Laboratory, Imaging, and Diagnostic Test Results", choices: [
              { value: "cbc", text: "CBC" },
              { value: "xray", text: "X-Ray" },
              { value: "mri", text: "MRI" }
            ], hasOther: true },
            { type: "comment", name: "fuv_assessment_plan", title: "Problem Based Assessment and Plan" }
          ]
        },
        {
          name: "psychotherapy_session",
          title: "Psychotherapy Session",
          elements: [
            { type: "comment", name: "psychotherapy_subjective", title: "Psychotherapy Subjective" },
            { type: "comment", name: "psych_medications_supplements", title: "Medications and Supplements" },
            { type: "checkbox", name: "psych_mental_status_exam", title: "Mental Status Examination", choices: [
              { value: "appearance", text: "Appearance" },
              { value: "mood", text: "Mood" },
              { value: "thought", text: "Thought Process" },
              { value: "insight", text: "Insight & Judgment" }
            ], hasOther: true },
            { type: "checkbox", name: "psych_vital_signs", title: "Vital Signs", choices: [
              { value: "bp", text: "Blood Pressure" },
              { value: "hr", text: "Heart Rate" },
              { value: "temp", text: "Temperature" }
            ], hasOther: true },
            { type: "checkbox", name: "psych_rating_scales", title: "Rating Scales", choices: [
              { value: "phq9", text: "PHQ-9" },
              { value: "gad7", text: "GAD-7" }
            ], hasOther: true },
            { type: "comment", name: "psych_assessment_plan", title: "Problem-Based Assessment and Plan" }
          ]
        },
        {
          name: "new_behavioral_health_visit",
          title: "New Behavioral Health Visit",
          elements: [
            { type: "comment", name: "nbh_chief_complaint", title: "Chief Complaint" },
            { type: "comment", name: "nbh_present_illness", title: "History of Present Illness" },
            { type: "comment", name: "nbh_social_history", title: "Social History" },
            { type: "comment", name: "nbh_medical_history", title: "Medical History" },
            { type: "comment", name: "nbh_medications_supplements", title: "Medications and Supplements" },
            { type: "comment", name: "nbh_allergies", title: "Allergies" },
            { type: "comment", name: "nbh_family_history", title: "Family History" },
            { type: "checkbox", name: "nbh_mental_status_exam", title: "Mental Status Examination", choices: [
              { value: "orientation", text: "Orientation" },
              { value: "mood", text: "Mood" },
              { value: "cognition", text: "Cognition" }
            ], hasOther: true },
            { type: "checkbox", name: "nbh_vital_signs", title: "Vital Signs", choices: [
              { value: "bp", text: "Blood Pressure" },
              { value: "hr", text: "Heart Rate" }
            ], hasOther: true },
            { type: "checkbox", name: "nbh_rating_scales", title: "Rating Scales", choices: [
              { value: "phq9", text: "PHQ-9" },
              { value: "gad7", text: "GAD-7" }
            ], hasOther: true },
            { type: "comment", name: "nbh_assessment_plan", title: "Problem-Based Assessment and Plan" }
          ]
        }
      ]
    };

    const survey = new Survey.Model(surveyJson);
    survey.onComplete.add(function (sender) {
      console.log("Survey results:", sender.data);
    });
    $("#surveyContainer").Survey({ model: survey });
  </script>
</body>
</html>
